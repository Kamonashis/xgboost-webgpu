[package]
name = "xgboost-webgpu"
version = "0.1.0"
edition = "2021"
authors = ["Kamonashis Halder <kamonashis.halder@gmail.com>"]
description = "Universal WebGPU-accelerated XGBoost library in Rust for AMD, Apple Silicon, Intel, and NVIDIA GPUs"
license = "MIT"
readme = "README.md"
repository = "https://tea.ergotresearch.com/Ergot-Research/xgboost-webgpu"

[features]
default = ["webgpu"]
webgpu = ["dep:wgpu", "dep:bytemuck", "dep:futures-executor"]

[dependencies]
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rand = "0.9"

# WebGPU compute dependencies
wgpu = { version = "29.0", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
futures-executor = { version = "0.3", optional = true }

[dev-dependencies]
rand = "0.9"

[[example]]
name = "california_housing"
path = "examples/california_housing.rs"

[[example]]
name = "binary_classification"
path = "examples/binary_classification.rs"

[[example]]
name = "advanced_features"
path = "examples/advanced_features.rs"
